# Sidebar layout, one list of lines per match state (see GameState). Lines
# are MiniMessage templates; {placeholder} tokens are substituted live.
# Colors are theme tags (<primary>, <accent>, <copper>, <iron> ... - see theme: in config.yml), so a new theme restyles this too.
#
# Available everywhere:
#   {arena} {phase} {time} {players} {min_players} {max_players}
#   {copper_score} {iron_score} {copper_steals} {iron_steals}
#   {copper_golem_count} {iron_golem_count}
#   {relic_holder} (player name, or "-") {relic_countdown}
#
# Two special lines expand into one line per golem on that team (formatted
# with golem-line below, which supports {stage} and {carrying}):
#   <golems:copper>
#   <golems:iron>
#
# "footer" is appended after every state's lines. Max 15 lines total
# (title doesn't count) - anything past that is dropped.

title: "<primary><bold>COPPER HEIST"

# Shown to any online player not currently in a match (before /ch join, or
# after leaving one). {arenas_enabled} {arenas_total} {players_online}, and per player: {level} {rank} {xp_bar} {coins}
# (the board holds 15 lines at most - remove some lines here if you add more)
hub:
  title: "<primary><bold>COPPER HEIST"
  lines:
    - "<muted>Welcome!"
    - ""
    - "<primary>Level</primary> <dim><bar></dim> <accent>{level}</accent> {rank}"
    - "{xp_bar}"
    - "<primary>Coins</primary> <dim><bar></dim> <accent>{coins}"
    - ""
    - "<primary>Arenas</primary> <dim><bar></dim> <text>{arenas_enabled}/{arenas_total} open"
    - "<primary>Online</primary> <dim><bar></dim> <text>{players_online}"
    - ""
    - "<muted>Right-click the compass"
    - "<muted>to pick an arena"

# The tab list is built per player, so it can also use your own {level} {rank} {xp_bar} {coins}.
tab:
  header: "<primary><bold>COPPER HEIST</bold></primary> <dim><bar></dim> <muted>{arena}"
  footer: "<copper>Copper <accent>{copper_score}</accent></copper> <dim><bar></dim> <iron>Iron <accent>{iron_score}</accent></iron> <dim><bar></dim> <text>{time}</text> <dim><bar></dim> <accent>Lv {level}</accent> <dim><bar></dim> <accent>{coins}</accent> <muted>coins"

golem-line: " <dim><arrow></dim> {stage}{carrying}"

footer:
  - ""
  - "<dim>{arena}"

states:
  waiting:
    - "<muted>Waiting for players..."
    - "<primary>Players</primary> <dim><bar></dim> <text>{players}</text><dim>/</dim><muted>{min_players} needed"
  starting:
    - "<accent><bold>Starting in {time}"
    - "<primary>Players</primary> <dim><bar></dim> <text>{players}"
  setup:
    - "<info><bold>SETUP</bold> <dim><bar></dim> <muted>no loot yet"
    - "<muted>Time</muted> <dim><bar></dim> <text>{time}"
    - ""
    - "<copper><bold>COPPER</bold></copper> <dim><bar></dim> <accent>{copper_score}"
    - "<iron><bold>IRON</bold></iron> <dim><bar></dim> <accent>{iron_score}"
    - "<special>Relic</special> <dim><bar></dim> <text>{relic_holder} <dim>({relic_countdown})"
    - ""
    - "<copper>Golems {copper_golem_count}"
    - "<golems:copper>"
    - "<iron>Golems {iron_golem_count}"
    - "<golems:iron>"
  collection:
    - "<ok><bold>COLLECTION</bold> <dim><bar></dim> <muted>grab loot"
    - "<muted>Time</muted> <dim><bar></dim> <text>{time}"
    - ""
    - "<copper><bold>COPPER</bold></copper> <dim><bar></dim> <accent>{copper_score}"
    - "<iron><bold>IRON</bold></iron> <dim><bar></dim> <accent>{iron_score}"
    - "<special>Relic</special> <dim><bar></dim> <text>{relic_holder} <dim>({relic_countdown})"
    - ""
    - "<copper>Golems {copper_golem_count}"
    - "<golems:copper>"
    - "<iron>Golems {iron_golem_count}"
    - "<golems:iron>"
  heist:
    - "<accent><bold>HEIST</bold> <dim><bar></dim> <muted>drills unlocked"
    - "<muted>Time</muted> <dim><bar></dim> <text>{time}"
    - ""
    - "<copper><bold>COPPER</bold></copper> <dim><bar></dim> <accent>{copper_score}"
    - "<iron><bold>IRON</bold></iron> <dim><bar></dim> <accent>{iron_score}"
    - "<special>Relic</special> <dim><bar></dim> <text>{relic_holder} <dim>({relic_countdown})"
    - ""
    - "<copper>Golems {copper_golem_count}"
    - "<golems:copper>"
    - "<iron>Golems {iron_golem_count}"
    - "<golems:iron>"
  final_rush:
    - "<bad><bold>FINAL RUSH</bold> <dim><bar></dim> <muted>loot x2"
    - "<muted>Time</muted> <dim><bar></dim> <text>{time}"
    - ""
    - "<copper><bold>COPPER</bold></copper> <dim><bar></dim> <accent>{copper_score}"
    - "<iron><bold>IRON</bold></iron> <dim><bar></dim> <accent>{iron_score}"
    - "<special>Relic</special> <dim><bar></dim> <text>{relic_holder} <dim>({relic_countdown})"
    - ""
    - "<copper>Golems {copper_golem_count}"
    - "<golems:copper>"
    - "<iron>Golems {iron_golem_count}"
    - "<golems:iron>"
  ending:
    - "<accent><bold>Match over!"
    - "<copper>COPPER <accent>{copper_score}</accent></copper> <dim>-</dim> <iron><accent>{iron_score}</accent> IRON</iron>"
  resetting:
    - "<muted>Resetting arena..."
