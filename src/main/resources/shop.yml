# The shop. Cost is in loot value (the same unit LootItem tags everything with -
# a copper ingot is worth 1); paying removes that much carried loot, smallest
# pieces first, so buying is a real trade-off against delivering it.
#
# menu:
#   title, border (a material for the frame). The menu sizes itself to fit the entries; prices, locks and
#   the player's balance are shown automatically in each item's lore.
#
# items.<id>:
#   action          give-item (default), spawn-golem or command (plugins can add more)
#   material, amount, name, lore, cost
#   min-phase       setup | collection | heist | final_rush - locked until then
#   max-per-player  0 = unlimited;  cooldown-seconds  0 = none;  slot  fixed menu slot
#   give-item:      potion (e.g. strong_healing), color (#RRGGBB), item-name, tag: true
#                   (tag marks special-use items: honeycomb, storm_rod, oxidizer_splash, alarm, vault_drill)
#   command:        commands: ["give {player} diamond 1"]   ({player} and {team} are replaced)

menu:
  title: "<primary><bold>Copper Heist</bold></primary> <dim>»</dim> <text>Shop"
  border: GRAY_STAINED_GLASS_PANE   # the frame around the menu (any material; the size grows with the number of items)

items:
  honeycomb:
    material: HONEYCOMB
    tag: true
    cost: 3
    name: "<primary>Honeycomb"
    lore:
      - "<muted>Right-click a golem to wax"
      - "<muted>it - freezes its oxidation"
      - "<muted>stage for a while."
  wind_charges:
    material: WIND_CHARGE
    amount: 3
    cost: 4
    name: "<primary>Wind Charge x3"
    lore:
      - "<muted>Knockback projectiles."
  healing_potion:
    material: POTION
    potion: strong_healing
    cost: 4
    name: "<primary>Healing Potion"
    lore:
      - "<muted>Instant Health II."
  oxidizer_splash:
    material: SPLASH_POTION
    potion: water
    color: "#8B4513"
    tag: true
    cost: 6
    name: "<primary>Oxidizer Splash"
    lore:
      - "<muted>Ages enemy golems caught"
      - "<muted>in the splash by one stage."
  new_golem:
    action: spawn-golem
    material: COPPER_INGOT
    cost: 10
    name: "<primary>New Golem"
    lore:
      - "<muted>Builds a golem at your dock,"
      - "<muted>up to your team's cap."
  storm_rod:
    material: BLAZE_ROD
    tag: true
    cost: 15
    name: "<primary>Storm Rod"
    lore:
      - "<muted>Resets your golems near the"
      - "<muted>dock to Fresh. Zaps anyone"
      - "<muted>nearby, allies included."
  alarm:
    material: TRIPWIRE_HOOK
    tag: true
    cost: 5
    name: "<primary>Alarm"
    lore:
      - "<muted>Right-click a block near your"
      - "<muted>spawn to place it. Alerts your"
      - "<muted>team when an enemy walks by."
  vault_drill:
    material: IRON_PICKAXE
    tag: true
    min-phase: heist
    cost: 20
    name: "<primary>Vault Drill"
    lore:
      - "<muted>Right-click the enemy vault"
      - "<muted>door to start a breach."
      - "<muted>Defenders can break it."
      - "<dim>Unlocks in the Heist phase."
