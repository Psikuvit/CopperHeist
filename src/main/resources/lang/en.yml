# MiniMessage-format strings. {placeholder} tokens are substituted in code.
prefix: "<primary><bold>COPPER HEIST</bold></primary> <dim>»</dim> "

join: "<ok><check></ok> <text>Joined <primary>{arena}</primary> on the <bold>{team}</bold> team!"

relic:
  incoming: "<special>A Relic is surfacing..."
  spawned: "<special>The Relic has appeared!"
  picked-up: "<special>{player} picked up the Relic!"
  lost: "<bad>The Relic was lost! It will respawn soon."
  delivered: "<special>Relic delivered to {team} Vault (+{value})!"

summary:
  mvp: "<primary>MVP: <text>{player} <muted>({delivered} delivered)"
  top-thief: "<accent>Top Thief: <text>{player} <muted>({count} steals, {value} value)"
  best-mechanic: "<accent>Best Mechanic: <text>{player} <muted>({count} scrapes)"
  most-kills: "<accent>Most Kills: <text>{player} <muted>({count})"

phase:
  bar: "<primary>{phase} - {time} left"
  setup:
    title: "<info>SETUP"
    subtitle: "<muted>No loot yet - get ready"
    chat: "<info>Setup phase - loot appears when it ends."
  collection:
    title: "<ok>COLLECTION"
    subtitle: "<muted>Loot is spawning!"
    chat: "<ok>Collection phase - grab loot and get it to your dock."
  heist:
    title: "<accent>HEIST PHASE"
    subtitle: "<muted>Vault Drills unlocked"
    chat: "<accent>Heist phase - Vault Drills are now available in the shop."
  final-rush:
    title: "<bad>FINAL RUSH"
    subtitle: "<muted>Loot value x2, golems age faster"
    chat: "<bad>Final Rush! Delivered loot is worth double and everyone glows."

dock:
  picking: "<accent>Picking lock... {percent}%"
  unlocked: "<ok>Lock picked!"
  interrupted: "<bad>Lockpick interrupted - stay next to the chest."

feature-disabled: "<bad>That feature is disabled on this server."
blocked-command: "<bad>You can't use that command during a match."

alarm:
  placed: "<ok>Alarm placed ({count}/{cap})."
  cap-reached: "<bad>Your team already has the max number of alarms."
  too-far: "<bad>Alarms must be placed near your own spawn."
  triggered: "<bad>ALARM! An intruder was detected!"
  destroyed: "<accent>{player} destroyed an enemy alarm!"

drill:
  breached:
    title: "<bad><bold>VAULT BREACHED!"
    subtitle: "<muted>Get back and defend it!"
  no-door: "<bad>This arena has no vault door set for that team."
  already-active: "<bad>A drill is already breaching that vault."
  on-cooldown: "<bad>Vault Drill on cooldown ({seconds}s)."
  placed: "<primary>{team} placed a Vault Drill on the {target} Vault!"
  completed: "<primary>The {target} Vault has been breached! Attackers have {seconds}s to loot it."
  destroyed: "<ok>{player} destroyed the Vault Drill!"
  progress: "<primary>DRILL on {target} VAULT - {percent}%"

actionbar:
  shop-locked: "<bad>That unlocks in the {phase} phase."
  shop-limit: "<bad>You can only buy that {limit} time(s) per match."
  shop-cooldown: "<bad>Available again in {seconds}s."
  ability-dash: "<ok>Dash!"
  ability-heal: "<ok>Healing pulse!"
  respawning: "<bad>Respawning in {seconds}..."
  heist-only: "<bad>Vault Drills unlock in the Heist phase."
  carrying: "<primary>Carrying <accent>{value}</accent><dim>/</dim><muted>{limit}</muted>  <dim><bar></dim>  <muted>Speed</muted> <bad>-{speed}%</bad>  <dim><bar></dim>  <muted>Ability</muted> <text>{ability}"
  carry-limit: "<bad>Carrying too much loot! (limit {limit})"
  golem-already-fresh: "<muted>This golem is already fresh."
  golem-scraped: "<ok>Scraped golem back to {before} -> {after}"
  scrape-cooldown: "<bad>Scrape on cooldown ({seconds}s)"
  golem-carry-limit: "<bad>Carrying too much to take this stack."
  golem-stack-taken: "<primary>Took the oxidized golem's stack."
  cant-afford: "<bad>Not enough loot value - costs {cost}."
  purchased: "<ok>Bought {item}."
  golem-cap-reached: "<bad>Your team already has the max number of golems."
  golem-waxed: "<ok>Waxed! This golem won't age for a while."
  storm-rod-used: "<primary>Storm Rod triggered - nearby golems reset to Fresh."
  no-ability: "<muted>Your role has no active ability."
  ability-cooldown: "<bad>Ability on cooldown ({seconds}s)"
  thief-invisible: "<ok>You turned invisible! Breaks on attack or loot pickup."
  saboteur-reveal: "<ok>Enemy golems revealed for {seconds} seconds."
  stun-cleared: "<ok>Stun cleared - your golem is moving again."

# Optional per-language overrides of text that is normally configured elsewhere (a translation file may
# define any of these; English falls back to the source YAML):
#   roles.<id>.name / roles.<id>.description       (roles.yml)
#   shop.title, shop.items.<id>.name / .lore        (shop.yml)
#   guide.title, guide.author, guide.pages          (guide.yml)

game:
  starting-soon: "<ok>Enough players - starting in {seconds}s"
  countdown-cancelled: "<bad>Not enough players - countdown cancelled"
  countdown: "<accent>Starting in {seconds}..."
  confined: "<bad>Stay in your base during setup."
  forfeit-warning: "<accent>Other team left - {team} wins by forfeit in {seconds}s."
  title: "<primary>COPPER HEIST"
  subtitle: "<muted>Fill your vault!"

golem:
  oxidized-label: "<bad>OXIDIZED"
  fully-oxidized: "<bad>{team} golem #{number} has fully oxidized! Scrape it with an axe."

vault:
  locked: "<bad>Only golems can deliver loot into the vault."
  no-entry: "<bad>The vault is sealed."

loot-bag:
  label: "<accent>Loot Bag [{value}] {seconds}s"

lobby:
  join-line: "<ok>[Join] <primary>{arena}<muted> ({state}, {players} players)"
  join-hover: "<ok>Click to join {arena}"
  no-arenas: "<bad>No arenas are open right now."
  compass-name: "<primary><bold>Play</bold> <dim><bar></dim> <text>Choose an arena"
  compass-lore: "<muted>Right-click to open the arena list"
  leave-name: "<bad><bold>Leave</bold> <dim><bar></dim> <text>Back to the lobby"
  cosmetics-name: "<special><bold>Cosmetics</bold> <dim><bar></dim> <text>Trails, effects and titles"
  cosmetics-lore: "<muted>Right-click to open your cosmetics"

status:
  enabled: "enabled"
  disabled: "disabled"

join-error:
  maintenance: "The game is in maintenance mode - try again later."
  no-arena: "No joinable arena available right now."
  not-enabled: "That arena isn't enabled."
  failed: "Couldn't join {arena} (full or already running)."

spectate:
  leave-first: "Leave your current match first."
  nothing: "Nothing to spectate there right now."
  no-point: "That arena has no spectator or lobby point set."

role:
  team-full: "Your team already has {count} {role}(s)."

event:
  total-suffix: " ({total} total)"
  loot-delivered: "<{color}>{team} delivered {value} loot!{total}"
  loot-stolen: "<accent>{player} stole loot from {victim}!"

match:
  winner: "<{color}>WINNER: {team} TEAM ({copper} - {iron})"
  draw: "<accent>DRAW ({copper} - {iron})"
  title-win: "<{color}>{team} WINS"
  title-draw: "<accent>DRAW"
  subtitle: "<muted>{copper} - {iron}"

# Menu text (chest GUIs). Colors are theme tags, so a new theme restyles these too.
gui:
  close: "<bad><bold>Close"
  back: "<accent><bold>Back"
  confirm: "<ok><bold>Confirm"
  cancel: "<bad><bold>Cancel"
  page:
    previous: "<accent><arrow> Previous page <dim>({page}/{pages})"
    next: "<accent>Next page <arrow> <dim>({page}/{pages})"
    info: "<muted>Page <text>{page}</text> of <text>{pages}"
  shop:
    balance-name: "<accent><bold>Your loot"
    balance-lore: "<muted>Carrying <accent>{value}</accent> value"
    balance-hint: "<dim>Spend it here, or deliver it to your vault."
    cost-ok: "<muted>Cost</muted> <dim><bar></dim> <ok>{cost} value"
    cost-bad: "<muted>Cost</muted> <dim><bar></dim> <bad>{cost} value</bad> <dim>(you have {have})"
    click: "<accent><arrow> Click to buy"
    need-more: "<bad><cross> Not enough loot"
    locked: "<bad><cross> Unlocks in the <text>{phase}</text> phase"
    limit: "<bad><cross> Limit reached ({limit} per match)"
    cooldown: "<bad><cross> Ready again in {seconds}s"
  roles:
    title: "<primary><bold>Choose your role"
    ability: "<muted>Ability</muted> <dim><bar></dim> <text>{ability}</text> <dim>({cooldown}s cooldown)"
    limit: "<muted>Team limit</muted> <dim><bar></dim> <text>{limit}"
    selected: "<ok><check> Selected"
    click: "<accent><arrow> Click to choose"
  arena:
    title: "<primary><bold>Choose an arena"
    state:
      waiting: "<ok><dot> Waiting for players"
      starting: "<accent><dot> Starting soon"
      setup: "<bad><dot> In progress <dim>(setup)"
      collection: "<bad><dot> In progress"
      heist: "<bad><dot> In progress <dim>(heist)"
      final_rush: "<bad><dot> In progress <dim>(final rush)"
      ending: "<muted><dot> Match ending"
      resetting: "<muted><dot> Resetting"
    players: "<muted>Players</muted> <dim><bar></dim> <accent>{players}</accent><dim>/</dim><text>{max}"
    preset: "<muted>Mode</muted> <dim><bar></dim> <text>{preset}"
    server: "<muted>Server</muted> <dim><bar></dim> <text>{server}"
    click: "<accent><arrow> Click to join"
    unavailable: "<bad><cross> Can't join right now"
    none-name: "<bad>No arenas open"
    none-lore: "<muted>Check back in a moment."

