# Copper Heist - Core Loop MVP configuration.
# See copper_heist_design.txt for the full long-term design; only the values
# used by this MVP build are here.

match:
  min-players: 6
  max-players: 16
  duration-seconds: 900
  starting-countdown-seconds: 10
  ending-seconds: 10
  respawn-delay-seconds: 6
  forfeit-seconds: 30
  hidden-enemy-score: false
  rejoin-grace-seconds: 60
  allowed-commands: [ch, copperheist, msg, tell, w, r, reply]
  # Elapsed seconds since match start at which each phase ends. FINAL_RUSH
  # runs from heist-end-seconds until duration-seconds.
  phases:
    setup-seconds: 60
    collection-end-seconds: 480
    heist-end-seconds: 780

shop:
  command-radius: 15

dock:
  lockpick-seconds: 4.0
  unlock-window-seconds: 15

# Optional anti-turtle rule: a team that delivers nothing for a while sees its golems age faster.
vault-decay:
  enabled: false
  after-seconds: 120
  aging-multiplier: 1.5

spawn-protection:
  radius: 6
  damage-per-second: 2.0
  invulnerable-seconds: 3

final-rush:
  loot-multiplier: 2.0
  loot-respawn-multiplier: 0.5
  aging-multiplier: 2.0
  all-players-glow: true

loot:
  respawn-seconds: 35
  cache-respawn-seconds: 60
  carry-limit: 80
  weight-per-10-value: 0.05
  max-slowdown: 0.35
  bag-despawn-seconds: 45
  unclaimed-bonus:
    after-seconds: 60
    every-seconds: 30
    max-bonus: 5

relic:
  # Elapsed seconds since match start. Add 840 for an extra Final Rush relic.
  spawn-times: [180, 360, 540, 720]
  lost-respawn-seconds: 30
  holder-extra-carry: 20

golems:
  starting: 2
  cap: 4
  health: 30.0
  base-speed: 0.3
  speed-multipliers:
    fresh: 1.0
    exposed: 0.8
    weathered: 0.55
    oxidized: 0.0
  aging-seconds: 210
  aging-jitter-seconds: 20
  scrape-cooldown-seconds: 20
  wax-duration-seconds: 180
  stun-seconds: 3
  stun-immunity-seconds: 5
  auto-respawn-seconds: 60

alarms:
  base-per-team: 4
  placement-radius: 20
  trigger-radius: 4
  cooldown-seconds: 8
  intruder-glow-seconds: 3

drill:
  health: 40.0
  hit-damage: 5.0
  duration-seconds: 30
  attacker-radius: 6
  breach-open-seconds: 20
  cooldown-seconds: 90
