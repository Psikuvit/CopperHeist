# Bumped automatically by the plugin when it migrates an older file - do not edit.
config-version: 1

# Copper Heist - Core Loop MVP configuration.
# See copper_heist_design.txt for the full long-term design; only the values
# used by this MVP build are here.

match:
  min-players: 6
  max-players: 16
  duration-seconds: 900
  starting-countdown-seconds: 10
  ending-seconds: 10
  respawn-delay-seconds: 6
  forfeit-seconds: 30
  # With a base region set (arena setbase1/2 <arena> <team>), keep players inside it during SETUP.
  setup-confine-to-base: false
  hidden-enemy-score: false
  rejoin-grace-seconds: 60
  allowed-commands: [ch, copperheist, msg, tell, w, r, reply]
  # Elapsed seconds since match start at which each phase ends. FINAL_RUSH
  # runs from heist-end-seconds until duration-seconds.
  phases:
    setup-seconds: 60
    collection-end-seconds: 480
    heist-end-seconds: 780

# Keeps the worlds you play in calm. scope: arena (only worlds that contain an arena) | all (every world).
world-rules:
  scope: arena
  disable-mob-spawning: true      # natural spawns are cancelled; commands, spawn eggs and plugin-spawned mobs still work
  pvp-only-in-game: true          # players can only hurt each other during a running match, in the same match

shop:
  command-radius: 15

gust-pads:
  cooldown-seconds: 1
  push-multiplier: 0.5
  lift-multiplier: 0.9
  sound: entity.ender_dragon.flap

dock:
  max-drift: 1.5
  lockpick-seconds: 4.0
  unlock-window-seconds: 15

# Optional anti-turtle rule: a team that delivers nothing for a while sees its golems age faster.
vault-decay:
  enabled: false
  after-seconds: 120
  aging-multiplier: 1.5

spawn-protection:
  radius: 6
  damage-per-second: 2.0
  invulnerable-seconds: 3

final-rush:
  loot-multiplier: 2.0
  loot-respawn-multiplier: 0.5
  aging-multiplier: 2.0
  all-players-glow: true

loot:
  respawn-seconds: 35
  cache-respawn-seconds: 60
  carry-limit: 80
  weight-per-10-value: 0.05
  max-slowdown: 0.35
  bag:
    visual: item-display     # item-display | block-display | label-only
    item: BUNDLE              # for item-display
    block: CHEST              # for block-display
  bag-despawn-seconds: 45
  unclaimed-bonus:
    after-seconds: 60
    every-seconds: 30
    max-bonus: 5

relic:
  # Elapsed seconds since match start. Add 840 for an extra Final Rush relic.
  spawn-times: [180, 360, 540, 720]
  lost-respawn-seconds: 30
  holder-extra-carry: 20

# Team look-and-feel. name/prefix are shown in chat, tab and scoreboard; color is a chat color name;
# armor-color is a Bukkit color name (ORANGE, SILVER, ...) or a #RRGGBB hex for leather armor.
# Switch whole mechanics on or off. Disabled features simply never start.
# ---- selectable implementations -------------------------------------------------
# Each of these picks one of several built-in choices; an unknown value logs a warning and uses the default.

# Shop / role NPC standing at each team's shop point (arena setshop <arena> <team>).
# type: mannequin | villager | armor-stand | interaction | none
npc:
  type: villager
  name-format: "{team} Shop"        # MiniMessage; {team} is the team's display name
  mannequin:
    skin:
      type: player-name             # player-name | uuid | texture
      value: "Notch"                # a name, a UUID, or (texture) the base64 texture value
      signature: ""                 # only for type: texture
    pose: STANDING
    immovable: true
    show-name: true
    description: ""                 # MiniMessage line shown under the name; empty hides it
    skin-parts: {cape: true, jacket: true, sleeves: true, pants: true, hat: true}
  villager:
    profession: librarian
  armor-stand:
    small: false
    arms: true
  interaction:
    width: 0.9
    height: 1.9

# How the shop and role picker open: chest (inventory GUI) or dialog (Paper's pop-up dialog screen).
ui:
  menu: chest


# spectator-wait: watch from spectator mode | instant: back at spawn right away
# ghost: stay at your spawn, invisible and invulnerable, unable to pick anything up
respawn:
  mode: spectator-wait

# How an arena is cleaned after a match. entities: clear items/golems/displays/chests.
reset:
  method: entities        # entities | snapshot (also restores blocks from "arena snapshot")
  snapshot:
    blocks-per-tick: 20000

# Optional: sealed vault rooms. With vault.block-entry on, players can't walk into a vault region
# (arena setvaultregion1/2 <arena> <team>) except attackers during a vault drill's breach window.
vault:
  block-entry: false

# Where player stats are stored. type: sqlite (a local file, no setup) | mysql (shared between servers) | none.
# A database that cannot be reached only turns stats off; matches keep working.
database:
  type: sqlite
  sqlite:
    file: data.db                   # inside the plugin folder
  mysql:
    host: localhost
    port: 3306
    database: copperheist
    user: root
    password: ""
    use-ssl: false

stats:
  enabled: true
  flush-seconds: 30                 # how often pending numbers are written to the database

# Language files live in plugins/CopperHeist/lang/. per-player shows each player their own client language
# when a file for it exists; anything a translation lacks falls back to English.
language:
  default: en
  per-player: true

features:
  roles: true
  shop: true
  relics: true
  alarms: true
  vault-drill: true
  lockpicking: true
  loot-bags: true
  final-rush: true
  unclaimed-bonus: true

teams:
  copper:
    name: Copper
    color: gold
    prefix: "[C] "
    armor-color: ORANGE
  iron:
    name: Iron
    color: gray
    prefix: "[I] "
    armor-color: SILVER

golems:
  ai:
    arrive-distance: 1.5
    stuck-seconds: 8
    off-path-distance: 4
    off-path-seconds: 2
    corner-cut-distance: 1.5        # extra distance at which a middle waypoint counts as reached, so golems flow round corners
    repath-seconds: 0.5             # minimum time between path re-issues when a path ends early
    max-path-failures: 3            # a waypoint that can't be pathed to this many times in a row is skipped
  animation:
    enabled: true                   # arm animations, the held item, and the effects below
    pause-seconds: 1.0              # how long a golem stands still while picking up or dropping off
    sounds: true
    particles: true
  storm-rod:
    radius: 8
    damage: 6.0
  starting: 2
  cap: 4
  health: 30.0
  base-speed: 0.3
  speed-multipliers:
    fresh: 1.0
    exposed: 0.8
    weathered: 0.55
    oxidized: 0.0
  aging-seconds: 210
  aging-jitter-seconds: 20
  scrape-cooldown-seconds: 20
  wax-duration-seconds: 180
  stun-seconds: 3
  stun-immunity-seconds: 5
  auto-respawn-seconds: 60

alarms:
  base-per-team: 4
  placement-radius: 20
  trigger-radius: 4
  cooldown-seconds: 8
  intruder-glow-seconds: 3

drill:
  health: 40.0
  hit-damage: 5.0
  duration-seconds: 30
  attacker-radius: 6
  breach-open-seconds: 20
  cooldown-seconds: 90
