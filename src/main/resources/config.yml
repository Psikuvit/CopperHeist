# Bumped automatically by the plugin when it migrates an older file - do not edit.
config-version: 1

# Copper Heist - Core Loop MVP configuration.
# See copper_heist_design.txt for the full long-term design; only the values
# used by this MVP build are here.

match:
  min-players: 6
  max-players: 16
  duration-seconds: 900
  starting-countdown-seconds: 10
  ending-seconds: 10
  respawn-delay-seconds: 6
  forfeit-seconds: 30
  # With a base region set (arena setbase1/2 <arena> <team>), keep players inside it during SETUP.
  setup-confine-to-base: false
  hidden-enemy-score: false
  rejoin-grace-seconds: 60
  allowed-commands: [ch, copperheist, msg, tell, w, r, reply]
  # Elapsed seconds since match start at which each phase ends. FINAL_RUSH
  # runs from heist-end-seconds until duration-seconds.
  phases:
    setup-seconds: 60
    collection-end-seconds: 480
    heist-end-seconds: 780

# The plugin's look. Every message, menu, scoreboard line and book page uses these named colors (<primary>, <ok>, <bad> ...),
# so changing them here restyles everything, including translations. Hex (#RRGGBB) or a vanilla color name. /ch reload applies it.
theme:
  primary: "#E8853A"                # headings and highlights
  secondary: "#B87333"              # the copper accent used for names and titles
  accent: "#FFC857"                 # values, prices, things to notice
  ok: "#7BD88F"                     # success, "available"
  bad: "#F26D6D"                    # errors, "locked"
  info: "#6CB6FF"                   # neutral notices
  text: "#EDEDED"                   # body text
  muted: "#A0A4AB"                  # secondary text
  dim: "#5C6067"                    # separators and footers
  special: "#C792EA"                # relics and rare things
  copper: "#E8853A"                 # the copper team
  iron: "#B8C4D0"                   # the iron team

# Keeps the worlds you play in calm. scope: arena (only worlds that contain an arena) | all (every world).
world-rules:
  scope: arena
  disable-mob-spawning: true      # natural spawns are cancelled; commands, spawn eggs and plugin-spawned mobs still work
  pvp-only-in-game: true          # players can only hurt each other during a running match, in the same match

# What happens to players in the hub (everyone who is not in a running match). Admins with copperheist.admin.bypass are exempt from clear-on-join only.
lobby:
  clear-on-join: true             # joining the server wipes items, armor, offhand, potion effects, glow and vitals, then gives the hub kit
  lock-items: true                # the compass, guide book and leave bed can't be dropped, moved into containers or swapped to the offhand
  protect-players: true           # no damage of any kind (void rescues you) and no hunger outside a running match, for everyone
  teleport-on-join: true          # players joining the server are sent to the hub spawn (/ch setlobby), if one is set

# Action bar: messages ("Bought X", warnings) stay for this long and beat the looped status line (what you carry).
# Progress bars and the respawn countdown are higher priority than ordinary messages.
actionbar:
  message-seconds: 2

shop:
  command-radius: 15

gust-pads:
  cooldown-seconds: 1
  push-multiplier: 0.5
  lift-multiplier: 0.9
  sound: entity.ender_dragon.flap

dock:
  max-drift: 1.5
  lockpick-seconds: 4.0
  unlock-window-seconds: 15

# Optional anti-turtle rule: a team that delivers nothing for a while sees its golems age faster.
vault-decay:
  enabled: false
  after-seconds: 120
  aging-multiplier: 1.5

spawn-protection:
  radius: 6
  damage-per-second: 2.0
  invulnerable-seconds: 3

final-rush:
  loot-multiplier: 2.0
  loot-respawn-multiplier: 0.5
  aging-multiplier: 2.0
  all-players-glow: true

loot:
  respawn-seconds: 35
  cache-respawn-seconds: 60
  carry-limit: 80
  weight-per-10-value: 0.05
  max-slowdown: 0.35
  bag:
    visual: item-display     # item-display | block-display | label-only
    item: BUNDLE              # for item-display
    block: CHEST              # for block-display
  bag-despawn-seconds: 45
  unclaimed-bonus:
    after-seconds: 60
    every-seconds: 30
    max-bonus: 5

relic:
  # Elapsed seconds since match start. Add 840 for an extra Final Rush relic.
  spawn-times: [180, 360, 540, 720]
  lost-respawn-seconds: 30
  holder-extra-carry: 20

# Team look-and-feel. name/prefix are shown in chat, tab and scoreboard; color is a chat color name;
# armor-color is a Bukkit color name (ORANGE, SILVER, ...) or a #RRGGBB hex for leather armor.
# Switch whole mechanics on or off. Disabled features simply never start.
# ---- selectable implementations -------------------------------------------------
# Each of these picks one of several built-in choices; an unknown value logs a warning and uses the default.

# Shop / role NPC standing at each team's shop point (arena setshop <arena> <team>).
# type: mannequin | villager | armor-stand | interaction | none
npc:
  type: villager
  name-format: "{team} Shop"        # MiniMessage; {team} is the team's display name
  mannequin:
    skin:
      type: player-name             # player-name | uuid | texture
      value: "Notch"                # a name, a UUID, or (texture) the base64 texture value
      signature: ""                 # only for type: texture
    pose: STANDING
    immovable: true
    show-name: true
    description: ""                 # MiniMessage line shown under the name; empty hides it
    skin-parts: {cape: true, jacket: true, sleeves: true, pants: true, hat: true}
  villager:
    profession: librarian
  armor-stand:
    small: false
    arms: true
  interaction:
    width: 0.9
    height: 1.9

# How the shop and role picker open: chest (inventory GUI) or dialog (Paper's pop-up dialog screen).
ui:
  menu: chest


# spectator-wait: watch from spectator mode | instant: back at spawn right away
# ghost: stay at your spawn, invisible and invulnerable, unable to pick anything up
respawn:
  mode: spectator-wait

# How an arena is cleaned after a match. entities: clear items/golems/displays/chests.
reset:
  method: entities        # entities | snapshot (also restores blocks from "arena snapshot")
  snapshot:
    blocks-per-tick: 20000

# Optional: sealed vault rooms. With vault.block-entry on, players can't walk into a vault region
# (arena setvaultregion1/2 <arena> <team>) except attackers during a vault drill's breach window.
vault:
  block-entry: false

# Where player stats are stored. type: sqlite (a local file, no setup) | mysql (shared between servers) | none.
# A database that cannot be reached only turns stats off; matches keep working.
database:
  type: sqlite
  sqlite:
    file: data.db                   # inside the plugin folder
  mysql:
    host: localhost
    port: 3306
    database: copperheist
    user: root
    password: ""
    use-ssl: false

# Several game servers behind one proxy (BungeeCord or Velocity) acting as one network. Needs a Redis server and,
# for shared stats, database.type: mysql pointing every server at the same database. Needs a restart to change.
# Every server lists the others' arenas in /ch list and can send players there with /ch join <server>.<arena>.
network:
  enabled: false
  server-id: server-1               # unique per server
  proxy-name: ""                    # the server's name in the proxy config; empty uses server-id
  cluster: default                  # servers with the same cluster name see each other's arenas
  status-seconds: 3                 # how often arena status is published and read
  profile-handoff-seconds: 8        # a joining server waits at most this long for the player's previous server to save them (then loads anyway)
  redis:
    host: localhost
    port: 6379
    password: ""
    database: 0
    ssl: false

# Pay players when a match ends. provider: none | vault (money through Vault) | commands (console commands).
# The winning team gets "win", the losing team "loss" (a draw pays nobody), and the MVP gets "mvp" as well.
rewards:
  provider: none
  vault:
    win: 100
    loss: 25
    mvp: 50
  commands:                         # {player} and {uuid} are filled in
    win: []                         # e.g. - "eco give {player} 100"
    loss: []
    mvp: []

leaderboards:
  refresh-seconds: 120              # how often the top lists are re-read from the database
  lines: 10                         # players shown per board and in /ch top
  default-stat: wins                # what /ch top shows when no stat is given

stats:
  enabled: true
  flush-seconds: 30                 # how often pending numbers are written to the database

# Language files live in plugins/CopperHeist/lang/. per-player shows each player their own client language
# when a file for it exists; anything a translation lacks falls back to English.
language:
  default: en
  per-player: true

features:
  roles: true
  shop: true
  relics: true
  alarms: true
  vault-drill: true
  lockpicking: true
  loot-bags: true
  final-rush: true
  unclaimed-bonus: true
  cosmetics: true       # unlockable cosmetics (needs stats/database and progression to be on)
  quests: true          # daily and weekly quests (needs stats/database)

cosmetics:
  featured-count: 3     # how many "featured today" picks the cosmetics menu shows (0-3); they change at midnight UTC
  max-active-trails: 48 # projectile trails running at once on the whole server; shots beyond that get no trail (keeps busy matches smooth)
  trail-max-ticks: 160  # a trail stops after this long even if the projectile is still flying
  victory-seconds: 5    # how long the winners' victory effects keep playing at the end of a match

# Put the player's level and equipped title in front of their name in chat. Off by default because other chat plugins also format chat -
# turn it on if this plugin does your chat, or use %copperheist_title% / %copperheist_level% in your chat plugin instead.
chat:
  enabled: false
  show-level: true
  show-title: true

teams:
  copper:
    name: Copper
    color: gold
    prefix: "[C] "
    armor-color: ORANGE
  iron:
    name: Iron
    color: gray
    prefix: "[I] "
    armor-color: SILVER

# Golems use vanilla Copper Golem AI: they find copper chests, take an item out, carry it and put it into a normal chest that is
# empty or already holds that item. The dock is therefore a COPPER chest and the vault a normal chest. The plugin only adds
# guards (below), stun, oxidation and scoring.
golems:
  label-height: 0.7              # how far above the golem's head its label floats
  starting: 2
  cap: 4
  health: 12.0                      # vanilla copper golem health
  base-speed: 0.2                   # vanilla movement speed; oxidation multiplies it (speed-multipliers below)
  speed-multipliers:
    fresh: 1.0
    exposed: 0.8
    weathered: 0.55
    oxidized: 0.0                   # fully oxidized golems stand still until scraped
  aging-seconds: 210
  aging-jitter-seconds: 20
  scrape-cooldown-seconds: 20
  wax-duration-seconds: 180
  stun-seconds: 3                   # a stunned golem stops (AI off) and drops what it holds
  stun-immunity-seconds: 5
  auto-respawn-seconds: 60
  storm-rod:
    radius: 8
    damage: 6.0
  guards:                           # keep vanilla golems inside the rules of the game
    enemy-base: true                # a golem that walks into the enemy base region is sent home (its item goes back to its dock)
    only-loot: true                 # anything a golem holds that isn't loot goes back to its dock
    hold-timeout-seconds: 45        # a golem that has held loot this long (vanilla has no chest that will take it) has it placed in its vault; 0 = never
  animation:
    enabled: true
    sounds: true
    particles: true

alarms:
  base-per-team: 4
  placement-radius: 20
  trigger-radius: 4
  cooldown-seconds: 8
  intruder-glow-seconds: 3
  show-box: true   # a glowing marker on each alarm, shown only to the owning team (enemies can't see it)

drill:
  health: 40.0
  hit-damage: 5.0
  duration-seconds: 30
  attacker-radius: 6
  breach-open-seconds: 20
  cooldown-seconds: 90
