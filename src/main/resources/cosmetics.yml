    effect: particle-trail
    name: "<special>Soul Fire Trail"
    description: ["<muted>Cold blue flames."]
    icon: SOUL_TORCH
    rarity: epic
    price: 900
    level: 12
    params: { particle: SOUL_FIRE_FLAME, spread: 0.03 }
  rainbow_trail:
    category: trail
    effect: particle-trail
