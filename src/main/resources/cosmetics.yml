    category: trail
    effect: particle-trail
    name: "<muted>Smoke Trail"
    description: ["<muted>A wisp of smoke."]
    icon: CAMPFIRE
    rarity: common
    price: 150
    params: { particle: SMOKE, spread: 0.02 }
  flame_trail:
    category: trail
    effect: particle-trail
    name: "<accent>Flame Trail"
    description: ["<muted>Your arrows leave a trail of fire."]
