# Cosmetics: things players unlock and equip that only change how the game looks (never how it plays).
# They are bought with coins (see progress.yml for how coins are earned), given as rewards, or granted by permission.
# /ch reload re-reads this file. A cosmetic with a mistake is skipped with a warning in the console; the rest still load.
#
# cosmetics.<id>:
#   category      trail | kill-effect | victory | golem | npc | title | join | death-message
#   effect        which effect plays it (not needed for titles). Effects come with the plugin or from other plugins.
#   name          MiniMessage; theme tags like <primary> work
#   description   lore lines shown in the menu
#   icon          the menu item (any material)
#   rarity        common | rare | epic | legendary (only changes the name's colour)
#   price         coins to buy it; 0 = it can't be bought (a reward, a permission or free)
#   level         progression level needed to buy it (or, for a free cosmetic, to get it); 0 = none
#   permission    a permission that grants it without buying. copperheist.cosmetic.<id> and copperheist.cosmetic.* always work too,
#                 so a store plugin can sell any cosmetic just by giving that permission
#   free          everyone has it from the start (from its level up)
#   hidden        not listed until the player has it
#   params        settings for the effect; each effect documents its own
#
# The list below is a starter set - edit, remove or add to it freely. This file is not updated automatically when the plugin updates
# (removing a cosmetic here should stay removed), so new ones added by an update arrive with a fresh copy of the file.

# ---------------------------------------------------------------------------------------------------------------------
# Effects that ship with the plugin (effect: ...) and their params:
#   particle-trail   trail          particle, count, spread, speed, color, size, material - a trail behind arrows and other projectiles
#   particle-burst   kill-effect, victory, join, golem
#                                   the same params plus shape (burst | ring | sphere | rain | spiral), radius, height
#   firework         kill-effect, victory, join     colors, fade, type (BALL | BALL_LARGE | STAR | BURST | CREEPER), trail, flicker
#   lightning        kill-effect, victory           no params (looks like lightning but does no damage)
#   golem-hat        golem          material, scale, lift - an item worn on the team's golems
#   npc-skin         npc            type (player-name | uuid | texture), value, signature - a skin for the team's shop NPC (Mannequin NPC type)
#   death-message    death-message  message - MiniMessage announced to the match when you defeat someone; {killer} and {victim} are the names
# Titles need no effect. Golem and shop-skin cosmetics belong to the whole team: the rarest one equipped by anyone on the team is shown.
# ---------------------------------------------------------------------------------------------------------------------

cosmetics:

  # ---- arrow and projectile trails ----
  copper_dust_trail:
    category: trail
    effect: particle-trail
    name: "<copper>Copper Dust Trail"
    description: ["<muted>A warm copper glow behind your arrows."]
    icon: COPPER_INGOT
    rarity: common
    free: true                    # everyone starts with this one
    params: { particle: DUST, color: "#B87333", size: 1.0 }
