    rarity: rare
    price: 400
    level: 3
    params: { particle: FLAME, spread: 0.03 }
  heart_trail:
    category: trail
    effect: particle-trail
    name: "<bad>Heart Trail"
    description: ["<muted>Spread the love."]
    icon: RED_DYE
    rarity: rare
    price: 300
    level: 5
    params: { particle: HEART, spread: 0.1 }
  note_trail:
    category: trail
    effect: particle-trail
    name: "<ok>Music Trail"
    description: ["<muted>Your shots make music."]
    icon: NOTE_BLOCK
    rarity: rare
    price: 300
    level: 5
    params: { particle: NOTE }
  end_rod_trail:
