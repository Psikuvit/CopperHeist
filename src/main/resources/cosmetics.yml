    effect: particle-burst
    name: "<special>Soul Burst"
    description: ["<muted>Their soul rises."]
    icon: SOUL_LANTERN
    rarity: rare
    price: 350
    level: 5
    params: { particle: SOUL, shape: sphere, radius: 1.2 }
  lightning_strike:
    category: kill-effect
    effect: lightning
    name: "<info>Lightning Strike"
    description: ["<muted>Thunder answers every kill.", "<dim>Looks real, harms no one."]
    icon: LIGHTNING_ROD
    rarity: rare
    price: 500
    level: 8
  coin_rain:
