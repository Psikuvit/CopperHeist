# MiniMessage-format strings. {placeholder} tokens are substituted in code.
prefix: "<gray>[<gold>Copper Heist</gold>]</gray> "

join: "<green>Joined arena {arena} on the {team} team!"

relic:
  incoming: "<light_purple>A Relic is surfacing..."
  spawned: "<light_purple>The Relic has appeared!"
  picked-up: "<light_purple>{player} picked up the Relic!"
  lost: "<red>The Relic was lost! It will respawn soon."
  delivered: "<light_purple>Relic delivered to {team} Vault (+25)!"

summary:
  mvp: "<gold>MVP: <white>{player} <gray>({delivered} delivered)"
  top-thief: "<yellow>Top Thief: <white>{player} <gray>({count} steals, {value} value)"
  best-mechanic: "<yellow>Best Mechanic: <white>{player} <gray>({count} scrapes)"
  most-kills: "<yellow>Most Kills: <white>{player} <gray>({count})"

phase:
  bar: "<gold>{phase} - {time} left"
  setup:
    title: "<blue>SETUP"
    subtitle: "<gray>No loot yet - get ready"
    chat: "<blue>Setup phase - loot appears when it ends."
  collection:
    title: "<green>COLLECTION"
    subtitle: "<gray>Loot is spawning!"
    chat: "<green>Collection phase - grab loot and get it to your dock."
  heist:
    title: "<yellow>HEIST PHASE"
    subtitle: "<gray>Vault Drills unlocked"
    chat: "<yellow>Heist phase - Vault Drills are now available in the shop."
  final-rush:
    title: "<red>FINAL RUSH"
    subtitle: "<gray>Loot value x2, golems age faster"
    chat: "<red>Final Rush! Delivered loot is worth double and everyone glows."

dock:
  picking: "<yellow>Picking lock... {percent}%"
  unlocked: "<green>Lock picked!"
  interrupted: "<red>Lockpick interrupted - stay next to the chest."

blocked-command: "<red>You can't use that command during a match."

alarm:
  placed: "<green>Alarm placed ({count}/{cap})."
  cap-reached: "<red>Your team already has the max number of alarms."
  too-far: "<red>Alarms must be placed near your own spawn."
  triggered: "<red>ALARM! An intruder was detected!"
  destroyed: "<yellow>{player} destroyed an enemy alarm!"

drill:
  breached:
    title: "<red><bold>VAULT BREACHED!"
    subtitle: "<gray>Get back and defend it!"
  no-door: "<red>This arena has no vault door set for that team."
  already-active: "<red>A drill is already breaching that vault."
  on-cooldown: "<red>Vault Drill on cooldown ({seconds}s)."
  placed: "<gold>{team} placed a Vault Drill on the {target} Vault!"
  completed: "<gold>The {target} Vault has been breached! Attackers have {seconds}s to loot it."
  destroyed: "<green>{player} destroyed the Vault Drill!"
  progress: "<gold>DRILL on {target} VAULT - {percent}%"

actionbar:
  shop-locked: "<red>That unlocks in the {phase} phase."
  shop-limit: "<red>You can only buy that {limit} time(s) per match."
  shop-cooldown: "<red>Available again in {seconds}s."
  ability-dash: "<green>Dash!"
  ability-heal: "<green>Healing pulse!"
  respawning: "<red>Respawning in {seconds}..."
  heist-only: "<red>Vault Drills unlock in the Heist phase."
  carrying: "<gold>Carrying: {value}/{limit} value  |  Speed -{speed}%  |  Ability: {ability}"
  carry-limit: "<red>Carrying too much loot! (limit {limit})"
  golem-already-fresh: "<gray>This golem is already fresh."
  golem-scraped: "<green>Scraped golem back to {before} -> {after}"
  scrape-cooldown: "<red>Scrape on cooldown ({seconds}s)"
  golem-carry-limit: "<red>Carrying too much to take this stack."
  golem-stack-taken: "<gold>Took the oxidized golem's stack."
  cant-afford: "<red>Not enough loot value - costs {cost}."
  purchased: "<green>Bought {item}."
  golem-cap-reached: "<red>Your team already has the max number of golems."
  golem-waxed: "<green>Waxed! This golem won't age for a while."
  storm-rod-used: "<gold>Storm Rod triggered - nearby golems reset to Fresh."
  no-ability: "<gray>Your role has no active ability."
  ability-cooldown: "<red>Ability on cooldown ({seconds}s)"
  thief-invisible: "<green>You turned invisible! Breaks on attack or loot pickup."
  saboteur-reveal: "<green>Enemy golems revealed for 10 seconds."
  stun-cleared: "<green>Stun cleared - your golem is moving again."
