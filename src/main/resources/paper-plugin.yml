name: CopperHeist
version: '${version}'
description: Team-based loot heist minigame - carry loot to your dock and let golems deliver it to the vault.

main: me.psikuvit.copperHeist.CopperHeist
api-version: '26.2'
load: POSTWORLD

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
    Vault:
      load: BEFORE
      required: false
    WorldEdit:
      load: BEFORE
      required: false
    FastAsyncWorldEdit:
      load: BEFORE
      required: false

permissions:
  copperheist.play:
    description: Join and play Copper Heist matches
    default: true
  copperheist.stats:
    description: View your own and other players' stats and leaderboards
    default: true
  copperheist.spectate:
    description: Spectate running matches
    default: true
  copperheist.cosmetics:
    description: Open the cosmetics menu (/ch cosmetics)
    default: true
  copperheist.cosmetic.*:
    description: Own every cosmetic (individual ones are copperheist.cosmetic.<id>) - ops have it by default
    default: op
  copperheist.admin.arena:
    description: Build and configure Copper Heist arenas
    default: op
  copperheist.admin.debug:
    description: Force-start/stop matches, jump phases, spawn relics and debug loot
    default: op
  copperheist.admin.reload:
    description: Reload configuration files
    default: op
  copperheist.admin.bypass:
    description: Use any command while inside a match, and join during maintenance
    default: op
  copperheist.admin.manage:
    description: Server administration - kick players from matches, edit stats, maintenance mode, broadcasts, delete arenas
    default: op
  copperheist.admin.*:
    description: All Copper Heist admin permissions
    default: op
    children:
      copperheist.admin.arena: true
      copperheist.admin.debug: true
      copperheist.admin.reload: true
      copperheist.admin.bypass: true
      copperheist.admin.manage: true
  copperheist.*:
    description: Everything
    default: op
    children:
      copperheist.play: true
      copperheist.stats: true
      copperheist.spectate: true
      copperheist.cosmetics: true
      copperheist.cosmetic.*: true
      copperheist.admin.*: true
